<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Interativo Pastel - Tema Creme e Preto</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #fff9e6; /* Amarelo Creme */
      color: #4a4e69;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    h1 {
      font-weight: 600;
      margin-bottom: 6px;
      color: #000000; /* Nome Mural em Preto */
    }

    p.subtitle {
      margin-bottom: 28px;
      color: #7d8597;
      font-size: 0.95rem;
    }

    /* Form para Criar Cartão */
    .card-form {
      background-color: #ffffff;
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      max-width: 960px;
      margin-bottom: 36px;
      box-sizing: border-box;
      align-items: center;
    }

    .card-form input, .card-form select {
      flex: 1;
      min-width: 200px;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
      color: #4a4e69;
      background-color: #fdfbfb;
    }

    .card-form input:focus, .card-form select:focus {
      border-color: #000000;
    }

    /* Botão Principal Preto */
    .card-form button {
      background-color: #000000; /* Botão Preto */
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .card-form button:hover {
      background-color: #333333; /* Cinza escuro ao passar o mouse */
    }

    /* Grid do Mural */
    .mural-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      max-width: 960px;
      width: 100%;
      counter-reset: card-counter;
    }

    /* Estrutura do Cartão 3D */
    .card {
      background-color: transparent;
      height: 250px;
      perspective: 1000px;
      counter-increment: card-counter;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .card.deleting {
      opacity: 0;
      transform: scale(0.8);
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 20px;
      box-sizing: border-box;
    }

    /* Frente do Cartão */
    .card-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: pointer;
      user-select: none;
    }

    .card-number-badge {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #5d627b;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 12px;
    }

    .card-number-badge::before {
      content: "#" counter(card-counter, decimal-leading-zero);
    }

    .btn-delete {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(255, 255, 255, 0.7);
      border: none;
      color: #e63946;
      font-size: 0.85rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      z-index: 2;
    }

    .btn-delete:hover {
      background: #ffdadf;
      transform: scale(1.1);
    }

    .card-front-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #3d405b;
      margin-bottom: 6px;
    }

    .card-front-hint {
      font-size: 0.8rem;
      color: #6c757d;
      opacity: 0.8;
    }

    /* Verso do Cartão com Textarea */
    .card-back {
      background-color: #ffffff;
      transform: rotateY(180deg);
      border: 2px solid #f0efeb;
      padding: 14px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .card-back-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 6px;
    }

    .action-btn {
      background: #f1f3f5;
      border: none;
      color: #495057;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: #e9ecef;
    }

    .action-btn.expand-btn {
      background: #000000;
      color: #ffffff;
    }

    .action-btn.expand-btn:hover {
      background: #333333;
    }

    /* Área de texto */
    .card-back textarea {
      width: 100%;
      flex: 1;
      border: none;
      resize: none;
      outline: none;
      font-family: inherit;
      font-size: 0.9rem;
      color: #2b2d42;
      line-height: 1.4;
      background: transparent;
      box-sizing: border-box;
      cursor: text;
    }

    .card-back textarea::-webkit-scrollbar {
      width: 5px;
    }

    .card-back textarea::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 10px;
    }

    .char-counter {
      font-size: 0.7rem;
      color: #a0aec0;
      text-align: right;
      margin-top: 4px;
    }

    /* Modal de Expansão (Tela Cheia) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      width: 90%;
      max-width: 650px;
      height: 70vh;
      border-radius: 24px;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #3d405b;
    }

    .modal-textarea {
      width: 100%;
      flex: 1;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      padding: 16px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.5;
      color: #2b2d42;
      resize: none;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
      box-sizing: border-box;
    }

    /* Botão Modal Preto */
    .modal-close-btn {
      background: #000000;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
      margin-top: 14px;
      transition: background-color 0.2s ease;
    }

    .modal-close-btn:hover {
      background: #333333;
    }

    /* Cores Pasteis */
    .pastel-menta    { background-color: #d8e2dc; }
    .pastel-pessego  { background-color: #ffe5d9; }
    .pastel-rosa     { background-color: #fec5bb; }
    .pastel-lavanda  { background-color: #e8dff5; }
    .pastel-azul     { background-color: #d8e1e9; }
    .pastel-amarelo  { background-color: #faedcd; }
  </style>
</head>
<body>

  <h1>Mural Interativo</h1>
  <p class="subtitle">Clique no cartão para virar. No verso, clique fora do texto ou em "← Voltar" para desvirar.</p>

  <!-- Form para criar novos cards -->
  <div class="card-form">
    <input type="text" id="frontTitleInput" placeholder="Título do Cartão (ex: Lembrete)">
    <select id="colorSelect">
      <option value="pastel-menta">Menta</option>
      <option value="pastel-pessego">Pêssego</option>
      <option value="pastel-rosa">Rosa</option>
      <option value="pastel-lavanda">Lavanda</option>
      <option value="pastel-azul">Azul</option>
      <option value="pastel-amarelo">Amarelo</option>
    </select>
    <button onclick="addNewCard()">+ Novo Cartão</button>
  </div>

  <!-- Container dos Cards -->
  <div class="mural-grid" id="muralGrid">
    
    <!-- Card 1 -->
    <div class="card" id="card-1">
      <div class="card-inner">
        <div class="card-front pastel-menta" onclick="toggleFlip('card-1')">
          <span class="card-number-badge"></span>
          <button class="btn-delete" title="Excluir Cartão" onclick="deleteCard('card-1', event)">🗑️</button>
          <div class="card-front-title">✨ Anotações</div>
          <div class="card-front-hint">Clique para virar ↻</div>
        </div>
        <div class="card-back" onclick="handleBackClick('card-1', event)">
          <div class="card-back-header">
            <button class="action-btn" onclick="toggleFlip('card-1')">← Voltar</button>
            <div>
              <button class="action-btn expand-btn" onclick="expandCard('card-1')">⤢ Expandir</button>
              <button class="action-btn" style="color: #e63946;" onclick="deleteCard('card-1', event)">🗑️</button>
            </div>
          </div>
          <textarea id="text-card-1" maxlength="2000" placeholder="Escreva seu recado aqui..." oninput="updateCounter('card-1')">Fundo amarelo creme e título/botões em preto aplicados com sucesso!</textarea>
          <div class="char-counter" id="count-card-1">71/2000</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Modal de Expansão (Tela Cheia) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Título do Cartão</div>
        <div class="char-counter" id="modalCounter">0/2000</div>
      </div>
      <textarea class="modal-textarea" id="modalTextarea" maxlength="2000" placeholder="Digite seu texto completo aqui..."></textarea>
      <button class="modal-close-btn" onclick="closeModal()">Salvar e Fechar</button>
    </div>
  </div>

  <script>
    let cardCount = 1;
    let activeCardIdForModal = null;

    function toggleFlip(cardId) {
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.toggle('flipped');
      }
    }

    function handleBackClick(cardId, event) {
      const targetTag = event.target.tagName;
      if (targetTag !== 'TEXTAREA' && targetTag !== 'BUTTON' && !event.target.closest('button')) {
        toggleFlip(cardId);
      }
    }

    function deleteCard(cardId, event) {
      if (event) event.stopPropagation();
      const card = document.getElementById(cardId);
      if (card && confirm('Deseja realmente excluir este cartão?')) {
        card.classList.add('deleting');
        setTimeout(() => {
          card.remove();
        }, 300);
      }
    }

    function updateCounter(cardId) {
      const textarea = document.getElementById(`text-${cardId}`);
      const counter = document.getElementById(`count-${cardId}`);
      if (textarea && counter) {
        counter.textContent = `${textarea.value.length}/2000`;
      }
    }

    function addNewCard() {
      const titleInput = document.getElementById('frontTitleInput');
      const title = titleInput.value.trim() || '✨ Novo Recado';
      const color = document.getElementById('colorSelect').value;

      cardCount++;
      const cardId = `card-${cardCount}`;
      const grid = document.getElementById('muralGrid');

      const newCard = document.createElement('div');
      newCard.className = 'card';
      newCard.id = cardId;

      newCard.innerHTML = `
        <div class="card-inner">
          <div class="card-front ${color}" onclick="toggleFlip('${cardId}')">
            <span class="card-number-badge"></span>
            <button class="btn-delete" title="Excluir Cartão" onclick="deleteCard('${cardId}', event)">🗑️</button>
            <div class="card-front-title">${title}</div>
            <div class="card-front-hint">Clique para virar ↻</div>
          </div>
          <div class="card-back" onclick="handleBackClick('${cardId}', event)">
            <div class="card-back-header">
              <button class="action-btn" onclick="toggleFlip('${cardId}')">← Voltar</button>
              <div>
                <button class="action-btn expand-btn" onclick="expandCard('${cardId}')">⤢ Expandir</button>
                <button class="action-btn" style="color: #e63946;" onclick="deleteCard('${cardId}', event)">🗑️</button>
              </div>
            </div>
            <textarea id="text-${cardId}" maxlength="2000" placeholder="Escreva seu recado aqui..." oninput="updateCounter('${cardId}')"></textarea>
            <div class="char-counter" id="count-${cardId}">0/2000</div>
          </div>
        </div>
      `;

      grid.appendChild(newCard);
      titleInput.value = '';
    }

    function expandCard(cardId) {
      activeCardIdForModal = cardId;
      const card = document.getElementById(cardId);
      const cardTitle = card.querySelector('.card-front-title').textContent;
      const cardColorClass = Array.from(card.querySelector('.card-front').classList).find(c => c.startsWith('pastel-'));
      const cardTextarea = document.getElementById(`text-${cardId}`);

      const modalOverlay = document.getElementById('modalOverlay');
      const modalContent = document.getElementById('modalContent');
      const modalTitle = document.getElementById('modalTitle');
      const modalTextarea = document.getElementById('modalTextarea');

      modalTitle.textContent = cardTitle;
      modalContent.className = `modal-content ${cardColorClass}`;
      modalTextarea.value = cardTextarea.value;

      updateModalCounter();

      modalTextarea.oninput = () => {
        cardTextarea.value = modalTextarea.value;
        updateCounter(cardId);
        updateModalCounter();
      };

      modalOverlay.classList.add('active');
    }

    function updateModalCounter() {
      const modalTextarea = document.getElementById('modalTextarea');
      const modalCounter = document.getElementById('modalCounter');
      modalCounter.textContent = `${modalTextarea.value.length}/2000`;
    }

    function closeModal() {
      const modalOverlay = document.getElementById('modalOverlay');
      modalOverlay.classList.remove('active');
      activeCardIdForModal = null;
    }
  </script>

  <script src="../../assets/voltar.js"></script>
</body>
</html>
